<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>디하북스 · 로그인 팝업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root{
      --background:#fff; --foreground:#141821; --border:#e5e7eb; --input:#e5e7eb;
      --primary:#049fdd; --muted-foreground:#6b7280; --destructive:#ef4444;
      --kakao:#ffd500; --kakao-foreground:#1a1a1a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
      background:rgba(0,0,0,.55); color:var(--foreground);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    }
    /* 모달 컨테이너 */
    .modal{
      width:100%; max-width:420px; background:var(--background);
      border-radius:12px; overflow:hidden; box-shadow:0 24px 48px rgba(0,0,0,.24);
    }
    .modal-body{padding:44px 28px 36px}
    .logo{display:block; height:28px; width:auto; margin:0 auto}
    .divider{margin-top:24px; border-top:1px solid rgba(229,231,235,.6)}
    .muted{color:var(--muted-foreground)}
    .req{color:var(--destructive)}
    /* 카카오 로그인 버튼 */
    .kakao-btn{
      margin-top:28px; width:100%; height:56px; border:0; border-radius:10px;
      background:var(--kakao); color:var(--kakao-foreground);
      font-family:inherit; font-weight:700; font-size:15px;
      display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    }
    .kakao-btn:hover{filter:brightness(.95)}
    .terms{margin-top:32px; font-size:11px; line-height:1.7; text-align:center; color:rgba(107,114,128,.8)}
    .terms u{text-underline-offset:2px}
</style>
</head>
